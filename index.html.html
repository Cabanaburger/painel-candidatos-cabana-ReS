<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabana Burger · Painel de Candidatos — Analista de Benefícios PL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#53A246;
    --green-dark:#3d7a33;
    --green-deep:#2e5c26;
    --cream:#FFF5CC;
    --bg:#FAF6EC;
    --panel:#FFFFFF;
    --ink:#211C12;
    --ink-soft:#5B5546;
    --line:#E7DFC8;
    --alto-bg:#E3F0DA; --alto-fg:#1F4014;
    --medio-bg:#FCEFC4; --medio-fg:#54400A;
    --baixo-bg:#FBE2DA; --baixo-fg:#642A16;
    --radius:18px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(33,28,18,.04), 0 8px 24px -12px rgba(33,28,18,.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:radial-gradient(circle at 100% 0%, rgba(83,162,70,0.07), transparent 45%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Sora',sans-serif;}
  a{color:var(--green-deep);}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  /* ---------- Header ---------- */
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:8px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand img{height:34px;display:block;}
  .vaga-block{margin-top:18px;}
  .vaga-eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green-deep);margin:0 0 6px;}
  .vaga-title{font-size:30px;font-weight:700;margin:0 0 6px;line-height:1.1;}
  .vaga-sub{font-size:14.5px;color:var(--ink-soft);margin:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .vaga-sub b{color:var(--ink);font-weight:600;}
  .selo-deco{height:84px;opacity:.92;transform:rotate(6deg);margin-top:-6px;}

  /* ---------- Summary bar ---------- */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0 22px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;}
  .stat .n{font-family:'Sora',sans-serif;font-size:26px;font-weight:700;line-height:1;}
  .stat .l{font-size:12.5px;color:var(--ink-soft);margin-top:4px;font-weight:500;}
  .stat.alto .n{color:var(--alto-fg);}
  .stat.medio .n{color:var(--medio-fg);}
  .stat.baixo .n{color:var(--baixo-fg);}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .seg{display:inline-flex;background:#EFE9D6;border-radius:999px;padding:3px;gap:2px;}
  .seg button{border:none;background:transparent;padding:7px 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-soft);}
  .seg button.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);}
  .toolbar-right{display:flex;gap:8px;align-items:center;}
  .btn-ghost{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;}
  .btn-ghost:hover{border-color:var(--green);color:var(--green-deep);}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;}

  /* ---------- Cards grid ---------- */
  #cardsView{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease, border-color .12s ease;position:relative;}
  .card:hover{transform:translateY(-2px);border-color:var(--green);}
  .card .rank{position:absolute;top:14px;right:16px;font-family:'Sora',sans-serif;font-size:11px;font-weight:700;color:var(--ink-soft);opacity:.5;}
  .card-top{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
  .avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--line);background:var(--cream);}
  .avatar-initials{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:15px;color:var(--green-deep);background:var(--cream);border:1px solid var(--line);}
  .card-name{font-size:15.5px;font-weight:600;margin:0;line-height:1.25;}
  .card-meta{font-size:12.5px;color:var(--ink-soft);margin:1px 0 0;}
  .badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;}
  .badge.alto{background:var(--alto-bg);color:var(--alto-fg);}
  .badge.medio{background:var(--medio-bg);color:var(--medio-fg);}
  .badge.baixo{background:var(--baixo-bg);color:var(--baixo-fg);}
  .mini-row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px;}
  .mini{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:7px;display:inline-flex;align-items:center;gap:4px;}
  .mini.alto{background:var(--alto-bg);color:var(--alto-fg);}
  .mini.medio{background:var(--medio-bg);color:var(--medio-fg);}
  .mini.baixo{background:var(--baixo-bg);color:var(--baixo-fg);}
  .card-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .card-row a{color:var(--ink-soft);text-decoration:none;}
  .card-row a:hover{color:var(--green-deep);text-decoration:underline;}
  .flag{display:flex;gap:6px;align-items:flex-start;font-size:11.5px;color:#8a4a1f;background:#FFF3E8;border:1px solid #F4DCC2;border-radius:8px;padding:6px 8px;margin-top:10px;line-height:1.35;}
  select.status-select{margin-top:12px;width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:12.5px;font-weight:600;background:var(--panel);color:var(--ink);}

  /* ---------- Table view ---------- */
  #tableView{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:none;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;padding:12px 14px;background:#F4EFDF;border-bottom:1px solid var(--line);}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:#FBF8EF;}
  tbody tr:last-child td{border-bottom:none;}
  .t-name{font-weight:600;display:flex;align-items:center;gap:9px;}
  .t-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .t-avatar-initials{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--green-deep);background:var(--cream);flex-shrink:0;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(33,28,18,.45);display:none;align-items:flex-start;justify-content:center;padding:32px 16px;z-index:50;overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--panel);border-radius:22px;max-width:760px;width:100%;padding:0;position:relative;box-shadow:0 24px 60px -20px rgba(0,0,0,.35);}
  .modal-head{padding:26px 30px 18px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start;}
  .modal-head .avatar,.modal-head .avatar-initials{width:62px;height:62px;font-size:20px;}
  .modal-close{position:absolute;top:18px;right:18px;border:none;background:#F4EFDF;width:32px;height:32px;border-radius:50%;font-size:16px;color:var(--ink-soft);}
  .modal-body{padding:22px 30px 30px;max-height:72vh;overflow-y:auto;}
  .modal-body h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--green-deep);margin:26px 0 10px;}
  .modal-body h3:first-child{margin-top:0;}
  .legend{font-size:11.5px;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  mark.hl-perfil{background:var(--alto-bg);color:var(--alto-fg);padding:1px 4px;border-radius:4px;font-weight:600;}
  mark.hl-rotina{background:var(--cream);color:#54400A;padding:1px 4px;border-radius:4px;font-weight:600;}
  .exp-item{margin-bottom:16px;padding-bottom:16px;border-bottom:1px dashed var(--line);}
  .exp-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .exp-period{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .exp-role{font-size:14.5px;font-weight:700;margin:1px 0 0;}
  .exp-company{font-size:12.5px;color:var(--ink-soft);margin:1px 0 6px;}
  .seg-tag{display:inline-block;font-size:10.5px;font-weight:700;background:#F4EFDF;color:var(--ink-soft);padding:2px 8px;border-radius:6px;margin-left:6px;}
  .exp-desc{font-size:13.5px;line-height:1.55;color:#3B3526;}
  .score-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .score-item{background:#FBF8EF;border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
  .score-item .k{font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .score-item select{width:100%;border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12.5px;font-weight:700;background:var(--panel);}
  .analise-box{background:#F4F8EF;border:1px solid #DCE9CF;border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.55;color:#2E4A22;}
  .contact-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .contact-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--panel);}
  .contact-btn:hover{border-color:var(--green);color:var(--green-deep);}
  .field-list{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{font-size:11.5px;background:#F4EFDF;color:var(--ink-soft);padding:4px 10px;border-radius:999px;font-weight:600;}
  textarea.note{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;min-height:60px;}
  .status-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  select.status-select-modal{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;background:var(--panel);}

  footer{margin-top:40px;text-align:center;font-size:11.5px;color:var(--ink-soft);}

  @media (max-width:640px){
    .summary{grid-template-columns:repeat(2,1fr);}
    .vaga-title{font-size:24px;}
    .selo-deco{display:none;}
    thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tbody tr{border-bottom:1px solid var(--line);padding:10px 14px;}
    tbody td{border-bottom:none;padding:3px 0;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="brand"><img src="" id="logoImg" alt="Cabana Burger"></div>
      <div class="vaga-block">
        <p class="vaga-eyebrow">Painel de candidatos</p>
        <h1 class="vaga-title">Analista de Benefícios PL</h1>
        <p class="vaga-sub"><b>Híbrido</b> · Escritório Alphaville, Barueri · mexe também com folha de pagamento</p>
      </div>
    </div>
    <img src="" id="seloImg" class="selo-deco" alt="">
  </header>

  <div class="summary" id="summaryBar"></div>

  <div class="toolbar">
    <div class="seg">
      <button id="btnCards" class="active">Cards</button>
      <button id="btnTable">Tabela</button>
    </div>
    <div class="toolbar-right">
      <button class="btn-ghost" id="btnRefresh"><span class="sync-dot"></span> Atualizar marcações</button>
    </div>
  </div>

  <div id="cardsView"></div>
  <div id="tableView">
    <table>
      <thead>
        <tr><th>Candidata(o)</th><th>Cidade</th><th>Pretensão</th><th>Aderência</th><th>Status</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>Painel gerado a partir dos currículos do Infojobs/Pandapé · Cabana Burger · marcações sincronizadas entre quem acessa este link</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-head" id="modalHead"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

// ---------- Setup ----------
document.getElementById('logoImg').src = IMG.logo;
document.getElementById('seloImg').src = IMG.selo;

const LEVEL_LABEL = {alto:'Alto', medio:'Médio', baixo:'Baixo'};
const LEVEL_VALUE = {alto:100, medio:60, baixo:20};
const WEIGHTS = {perfilScore:0.4, beneficiosScore:0.3, localizacaoScore:0.2, formacaoScore:0.1};
const CRIT_LABEL = {perfilScore:'Perfil híbrido', beneficiosScore:'Benefícios e folha', localizacaoScore:'Localização', formacaoScore:'Formação'};

const STATUS_OPTS = [
  {v:'aguardando', l:'Aguardando avaliação'},
  {v:'chamar', l:'Chamar para entrevista'},
  {v:'agendada', l:'Entrevista agendada'},
  {v:'aprovado', l:'Aprovado'},
  {v:'reprovado', l:'Reprovado'},
];
const STATUS_LABEL = Object.fromEntries(STATUS_OPTS.map(o=>[o.v,o.l]));

const STORAGE_KEY = 'cabana_beneficios_pl_status_v1';
let STATE = {}; // { [id]: { status, perfilOverride, nota } }

function initials(name){
  return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function overallScore(c){
  const perfil = (STATE[c.id] && STATE[c.id].perfilOverride) || c.perfilScore;
  const vals = {perfilScore:perfil, beneficiosScore:c.beneficiosScore, localizacaoScore:c.localizacaoScore, formacaoScore:c.formacaoScore};
  let score = 0;
  for(const k in WEIGHTS){ score += LEVEL_VALUE[vals[k]] * WEIGHTS[k]; }
  if(score>=75) return 'alto';
  if(score>=45) return 'medio';
  return 'baixo';
}

async function loadState(){
  try{
    const snap = await getDoc(statusDocRef);
    STATE = snap.exists() ? snap.data() : {};
  }catch(e){
    console.error('Não foi possível carregar as marcações agora', e);
  }
}

async function saveState(){
  try{
    await setDoc(statusDocRef, STATE);
  }catch(e){
    console.error('Não foi possível salvar a marcação agora', e);
  }
}

function setStatus(id, status){
  STATE[id] = STATE[id] || {};
  STATE[id].status = status;
  saveState();
  renderAll();
}

function setPerfilOverride(id, val){
  STATE[id] = STATE[id] || {};
  STATE[id].perfilOverride = val || null;
  saveState();
  renderAll();
}

function setNota(id, val){
  STATE[id] = STATE[id] || {};
  STATE[id].nota = val;
  saveState();
}

function getStatus(id){
  return (STATE[id] && STATE[id].status) || 'aguardando';
}

// ---------- Sorting ----------
function sortedCandidatos(){
  const order = {alto:0, medio:1, baixo:2};
  return [...CANDIDATOS].sort((a,b)=> order[overallScore(a)] - order[overallScore(b)]);
}

// ---------- Avatar helper ----------
function avatarHTML(c, sizeClass){
  if(c.foto && IMG[c.foto]){
    return `<img src="${IMG[c.foto]}" class="${sizeClass==='t'?'t-avatar':'avatar'}" alt="${c.nome}">`;
  }
  return `<div class="${sizeClass==='t'?'t-avatar-initials':'avatar-initials'}">${initials(c.nome)}</div>`;
}

// ---------- Summary ----------
function renderSummary(){
  const counts = {alto:0, medio:0, baixo:0};
  CANDIDATOS.forEach(c=> counts[overallScore(c)]++ );
  document.getElementById('summaryBar').innerHTML = `
    <div class="stat"><div class="n">${CANDIDATOS.length}</div><div class="l">Candidatos no painel</div></div>
    <div class="stat alto"><div class="n">${counts.alto}</div><div class="l">Aderência alta</div></div>
    <div class="stat medio"><div class="n">${counts.medio}</div><div class="l">Aderência média</div></div>
    <div class="stat baixo"><div class="n">${counts.baixo}</div><div class="l">Aderência baixa</div></div>
  `;
}

// ---------- Cards ----------
function renderCards(){
  const list = sortedCandidatos();
  document.getElementById('cardsView').innerHTML = list.map((c,i)=>{
    const score = overallScore(c);
    const status = getStatus(c.id);
    return `
    <div class="card" data-id="${c.id}">
      <span class="rank">#${i+1}</span>
      <div class="card-top">
        ${avatarHTML(c,'c')}
        <div>
          <p class="card-name">${c.nome}</p>
          <p class="card-meta">${c.idade?c.idade+' anos · ':''}${c.cidade}</p>
        </div>
      </div>
      <span class="badge ${score}">Aderência ${LEVEL_LABEL[score]}</span>
      <div class="mini-row">
        ${Object.keys(WEIGHTS).map(k=>{
          const val = (k==='perfilScore' && STATE[c.id] && STATE[c.id].perfilOverride) ? STATE[c.id].perfilOverride : c[k];
          return `<span class="mini ${val}">${CRIT_LABEL[k]}: ${LEVEL_LABEL[val]}</span>`;
        }).join('')}
      </div>
      <div class="card-row"><span>Pretensão</span><span>${c.pretensao}</span></div>
      <div class="card-row"><span>Fonte</span><span>${c.fonte.split(' (')[0]}</span></div>
      ${c.email?`<div class="card-row"><span>E-mail</span><a href="mailto:${c.email}" onclick="event.stopPropagation()">${c.email}</a></div>`:''}
      ${c.telefone?`<div class="card-row"><span>Telefone</span><a href="tel:+${c.whats}" onclick="event.stopPropagation()">${c.telefone}</a></div>`:''}
      ${c.locationFlag?`<div class="flag">⚠️ ${c.locationFlag}</div>`:''}
      <select class="status-select" data-id="${c.id}" onclick="event.stopPropagation()">
        ${STATUS_OPTS.map(o=>`<option value="${o.v}" ${o.v===status?'selected':''}>${o.l}</option>`).join('')}
      </select>
    </div>`;
  }).join('');

  document.querySelectorAll('#cardsView .card').forEach(el=>{
    el.addEventListener('click', ()=> openModal(el.getAttribute('data-id')));
  });
  document.querySelectorAll('#cardsView .status-select').forEach(el=>{
    el.addEventListener('change', e=> setStatus(el.getAttribute('data-id'), e.target.value));
  });
}

// ---------- Table ----------
function renderTable(){
  const list = sortedCandidatos();
  document.getElementById('tableBody').innerHTML = list.map(c=>{
    const score = overallScore(c);
    const status = getStatus(c.id);
    return `
    <tr data-id="${c.id}">
      <td><div class="t-name">${avatarHTML(c,'t')} ${c.nome}</div></td>
      <td>${c.cidade.split(' - ')[0].split(' (')[0]}</td>
      <td>${c.pretensao}</td>
      <td><span class="badge ${score}">${LEVEL_LABEL[score]}</span></td>
      <td>
        <select class="status-select-modal" data-id="${c.id}" onclick="event.stopPropagation()" style="font-size:12px;padding:5px 7px;">
          ${STATUS_OPTS.map(o=>`<option value="${o.v}" ${o.v===status?'selected':''}>${o.l}</option>`).join('')}
        </select>
      </td>
    </tr>`;
  }).join('');

  document.querySelectorAll('#tableBody tr').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.tagName==='SELECT') return;
      openModal(el.getAttribute('data-id'));
    });
  });
  document.querySelectorAll('#tableBody .status-select-modal').forEach(el=>{
    el.addEventListener('change', e=> setStatus(el.getAttribute('data-id'), e.target.value));
  });
}

function renderAll(){
  renderSummary();
  renderCards();
  renderTable();
}

      <span class="pill">Pretensão: ${c.pretensao}</span>
      <span class="pill">${c.jornada}</span>
      <span class="pill">${c.contrato}</span>
    </div>
  `;

  document.getElementById('perfilOverrideSelect').addEventListener('change', e=>{
    setPerfilOverride(c.id, e.target.value);
    openModal(c.id); // refresh modal with new score
  });
  document.getElementById('modalStatusSelect').addEventListener('change', e=> setStatus(c.id, e.target.value));
  document.getElementById('modalNote').addEventListener('blur', e=> setNota(c.id, e.target.value));

  document.getElementById('overlay').classList.add('open');
}

document.getElementById('modalClose').addEventListener('click', ()=> document.getElementById('overlay').classList.remove('open'));
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') document.getElementById('overlay').classList.remove('open'); });

// ---------- View toggle ----------
document.getElementById('btnCards').addEventListener('click', ()=>{
  document.getElementById('btnCards').classList.add('active');
  document.getElementById('btnTable').classList.remove('active');
  document.getElementById('cardsView').style.display='grid';
  document.getElementById('tableView').style.display='none';
});
document.getElementById('btnTable').addEventListener('click', ()=>{
  document.getElementById('btnTable').classList.add('active');
  document.getElementById('btnCards').classList.remove('active');
  document.getElementById('tableView').style.display='block';
  document.getElementById('cardsView').style.display='none';
});

document.getElementById('btnRefresh').addEventListener('click', async ()=>{
  await loadState();
  renderAll();
});

// ---------- Init ----------
(async function init(){
  await loadState();
  renderAll();
  setInterval(async ()=>{ await loadState(); renderAll(); }, 20000);
})();
</script>
</body>
</html>
